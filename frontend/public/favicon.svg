<!--
  탭 아이콘. 첫 화면의 BridgeSpot(app/ui.tsx)과 같은 뜻을 16px 에서도 읽히게 옮긴 것.
  왼쪽이 손에 든 폰, 오른쪽이 키오스크, 사이의 점이 폰이 대신 건네는 말이다.

  선이 아니라 면으로 그린다. 본디 그림은 5.5 굵기의 선화인데, 16px 로 줄면 선이
  1px 아래로 내려가 서로 뭉개진다. 같은 형태를 채워서 실루엣만 남겼다.

  바탕을 깐 이유 — 탭 막대 색은 브라우저와 테마마다 다르다. 종이색 판을 깔면
  어두운 탭에서도 마크가 그대로 보인다. 두 색 모두 design/tokens.ts 의 값이다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#FAF8F3" />
  <g fill="#111111">
    <!-- 손에 든 폰 -->
    <rect x="16" y="32" width="24" height="40" rx="6" />
    <!-- 폰이 대신 건네는 말 -->
    <circle cx="50" cy="52" r="5" />
    <!-- 키오스크 — 화면과 기둥과 받침 -->
    <rect x="58" y="20" width="28" height="38" rx="5" />
    <rect x="68" y="58" width="8" height="17" />
    <rect x="56" y="75" width="32" height="8" rx="3" />
  </g>
</svg>
