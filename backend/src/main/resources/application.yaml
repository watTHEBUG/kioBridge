spring:
  application:
    name: kiobridge
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

kiobridge:
  team-id: ${KIOBRIDGE_TEAM_ID:WHATTHEBUG}
  input-contract-version: ${KIOBRIDGE_INPUT_CONTRACT_VERSION:1.0.0}
  submission-version: ${KIOBRIDGE_SUBMISSION_VERSION:1.0.0}

  auth:
    session-ttl-seconds: ${AUTH_SESSION_TTL_SECONDS:28800}

  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

  simulation-api:
    base-url: ${SIMULATION_API_BASE_URL:http://localhost:4000}
    connect-timeout-ms: ${SIMULATION_API_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SIMULATION_API_READ_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

openai:
  api-key: ${OPENAI_API_KEY:}
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-transcribe}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:3000}
  # 외부 STT가 멈춰도 선택 기능 하나만 빠르게 실패하고 나머지 API는 계속 동작한다.
  transcription-read-timeout-ms: ${OPENAI_TRANSCRIPTION_READ_TIMEOUT_MS:12000}
