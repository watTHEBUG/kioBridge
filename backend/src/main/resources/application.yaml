spring:
  application:
    name: kiobridge
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

kiobridge:
  simulation-api:
    base-url: ${SIMULATION_API_BASE_URL:http://localhost:4000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never