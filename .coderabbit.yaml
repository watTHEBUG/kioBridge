language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "main" # dev는 기본 브랜치라 별도 설정 없이 자동 포함됨
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/gradle/wrapper/gradle-wrapper.jar"
    # Figma Make 재출력용으로 남겨 둔 shadcn 원본 48개. 어느 화면도 import 하지 않아
    # 번들에 들어가지 않는다(grep -rn "components/ui" src --exclude-dir=ui → 0건).
    # 리뷰가 계속 여기를 지적하는데 고쳐도 사용자에게 도달하는 코드는 안 바뀌므로 제외한다.
    # 다시 쓰기 시작하면 이 줄부터 지운다.
    - "!frontend/src/app/components/ui/**"

  path_instructions:
    - path: "backend/src/main/java/com/kiobridge/kiobridge/contracts/**"
      instructions: |
        이 폴더는 팀 전체가 공유하는 계약(Contract) 타입 + 공용 Simulation API 클라이언트(contracts/client)입니다.
        - KioBridge Simulation Kit의 ParticipantSubmission / Evidence 스키마(docs/API_CONTRACT.md)와 필드명·타입이 정확히 일치하는지 확인해줘.
        - 필드를 삭제하거나 이름을 바꾸는 변경은 다른 모듈(profilecontext, recommendation, executionplan, stateevidence)에 영향을 주니 breaking change 여부를 명확히 지적해줘.
        - profile / recommendation 필드가 아직 Object 타입 placeholder인 점은 알려진 상태이니 반복 지적하지 않아도 됨.
        - contracts/client/SimulationApiClient는 executionplan(submit/validate/execute)과 stateevidence(상태 폴링/run/evidence/error-injection)가 함께 쓰는 공용 클라이언트입니다. 특정 모듈 전용 메서드가 섞여 들어가지 않는지, connect/read timeout이 유지되는지 확인해줘.
        - Action.target에 좌표, automationId, btn 같은 값이 들어가지 않는지 확인해줘 (의미 기반 kind만 허용: candidate, option, service_type 등).
        - select_payment, confirm_payment 등 결제 관련 action 문자열이 어디에도 하드코딩되지 않았는지 확인해줘.
        - actualDeviceCommandSent, validationMode, executionEnvironment 같은 고정값이 실수로 다른 값으로 바뀌지 않았는지 확인해줘.

    - path: "backend/src/main/java/com/kiobridge/kiobridge/modules/executionplan/**"
      instructions: |
        이 모듈은 STEP 8~9(승인 결과 반영, ExecutionPlan 조립)와 제출 오케스트레이션을 담당합니다.
        실제 Simulation API 호출은 contracts/client/SimulationApiClient(공용)를 통해 이뤄집니다.
        - UserDecision.approved()가 false일 때 ExecutionPlan.actions가 비어있지 않은 경로가 있는지 반드시 확인해줘 (제출 직전 로컬 invariant 검증이 우회되지 않는지 포함).
        - buildExecutionPlan()이 recommendation 기반으로 Action을 올바른 순서(select_service_type → select_menu → select_option* → confirm_option → open_cart_review → verify_cart)로 조립하는지 확인해줘.

    - path: "backend/src/main/java/com/kiobridge/kiobridge/modules/recommendation/**"
      instructions: |
        추천 엔진 코드입니다.
        - hardConstraints(알레르기 등) 위반 후보가 점수만 낮아지는 게 아니라 결과 리스트에서 완전히 제외되는지 확인해줘.
        - available=false(품절) 후보가 추천 결과에 포함되지 않는지 확인해줘.
        - 추천 이유(explanation)가 최소 1개는 생성되는지 확인해줘.

    - path: "backend/src/main/java/com/kiobridge/kiobridge/modules/profilecontext/**"
      instructions: |
        프로필·SessionContext 정규화 코드입니다.
        - 값이 KioBridge 공식 enum(UPPER_SNAKE_CASE)으로 변환되는지 확인해줘. 예: "포장"이 아니라 TAKE_OUT.
        - intent / facts / preferences / hardConstraints / capabilities 6개 섹션 중 잘못된 섹션에 값이 들어가지 않았는지 확인해줘 (예: 알레르기는 반드시 hardConstraints).
        - 실제 개인정보(주민번호, 전화번호, 카드번호 등)로 보이는 값이 저장되지 않는지 확인해줘.

    - path: "backend/src/main/java/com/kiobridge/kiobridge/modules/stateevidence/**"
      instructions: |
        담당4(상태머신·증거/안전가드) 모듈입니다. 세션 상태 폴링(GET /sessions/:id), 실행 이력 조회(GET /sessions/:id/run),
        Evidence 조회(GET /sessions/:id/evidence), 오류 주입(POST /sessions/:id/error-injection)을 소비·처리합니다.
        - validate/execute 실패 응답을 무시하거나 삼키지 않고 사용자에게 전달하는지 확인해줘.
        - 외부 API(Simulation API)가 응답하지 않을 때 예외로 서비스 전체가 죽지 않는지 확인해줘.
        - 결제 Action이 계획에 있었다면 실행이 차단돼도(executed=0) planned>0이면 FAIL로 처리하는지 확인해줘 (Evidence의 plannedPaymentActionCount 기준).
        - 세션 생성/제출/검증/실행(session/submission/validate/execute)은 이 모듈이 아니라 executionplan 담당이니, 여기서 중복 호출하지 않는지 확인해줘.

    - path: "frontend/**"
      instructions: |
        - 로그인하지 않아도 핵심 흐름이 동작하는 구조인지 확인해줘.
        - 키보드만으로 조작 가능한지, 큰 글씨/고대비 옵션이 있는지 확인해줘.
        - 실제 개인정보를 로컬 저장소(localStorage 등)에 저장하지 않는지 확인해줘.

    - path: ".github/workflows/**"
      instructions: |
        - 시크릿 값이 하드코딩되지 않고 secrets 컨텍스트를 통해서만 참조되는지 확인해줘.
        - 외부 action의 버전이 고정(pin)되어 있는지 확인해줘.

chat:
  auto_reply: true
